name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharge des pages d'exemple
        run: |
          mkdir -p debug && cd debug
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          curl -sSL -A "$UA" -o champions.html https://jungler.gg/wild-rift/champions/ -w "champions %{http_code}\n"
          curl -sSL -A "$UA" -o vayne_adc.html https://jungler.gg/wild-rift/champions/vayne/build/adc/ -w "vayne %{http_code}\n"
          curl -sSL -A "$UA" -o ahri.html https://jungler.gg/wild-rift/champions/ahri/build/ -w "ahri %{http_code}\n"
          curl -sSL -A "$UA" -o ksante.html https://jungler.gg/wild-rift/champions/ksante/build/ -w "ksante %{http_code}\n"
          ls -la
      - name: Publie sur la branche debug
        run: |
          cd debug
          git init -q -b debug && git add . 
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" debug
